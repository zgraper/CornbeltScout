# keyword_sets.yaml
# ------------------
# Agriculture keyword dictionaries used by the keyword extractor and
# relevance classifier.
#
# Each top-level key is a named keyword set.  The keyword_extractor module
# will count hits for every set and store per-set scores in the database.
#
# Guidelines:
#   • Keep terms lowercase; the extractor normalises text before matching.
#   • Prefer specific technical terms over generic words to reduce false hits.
#   • Add new sets here to support future topic expansions (Phase 2+).

# -------------------------------------------------------------------------
# Core Corn-Belt crops
# -------------------------------------------------------------------------
crops:
  - corn
  - maize
  - soybeans
  - soybean
  - wheat
  - sorghum
  - oats
  - barley
  - alfalfa
  - hay
  - canola
  - sunflower
  - sugar beet
  - dry bean
  - cover crop
  - winter wheat
  - spring wheat

